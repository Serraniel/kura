[package]
name = "kura-gui"
description = "Qt/QML/Kirigami interface of kura"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "kura-gui"
path = "src/main.rs"

[dependencies]
kura-core.workspace = true
kura-i18n.workspace = true
kura-alpm.workspace = true
kura-helper.workspace = true
serde_json.workspace = true
cxx = "1"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_full"] }

[build-dependencies]
cxx-qt-build = { version = "0.10", features = ["link_qt_object_files"] }
qt-build-utils = "0.10"

[lints]
workspace = true
