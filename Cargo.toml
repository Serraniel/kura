[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-or-later"
repository = "https://github.com/Serraniel/kura"
authors = ["The kura contributors"]

[workspace.dependencies]
kura-core = { path = "crates/kura-core" }
kura-i18n = { path = "crates/kura-i18n" }
kura-sbom = { path = "crates/kura-sbom" }
kura-alpm = { path = "crates/kura-alpm" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
fluent-bundle = "0.16"
unic-langid = "0.9"
alpm = "5"
lexopt = "0.3"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"

[profile.release]
lto = "thin"
