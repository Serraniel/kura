name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Arch's rustc uses the system LLVM, so the matching tools are in /usr/bin.
  LLVM_COV: /usr/bin/llvm-cov
  LLVM_PROFDATA: /usr/bin/llvm-profdata

jobs:
  rust:
    name: rust
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Build against the libalpm, Qt and Rust that Arch users actually have.
    container: archlinux:base-devel
    steps:
      - name: Install toolchain
        run: pacman -Syu --noconfirm --needed rust clang llvm lld cargo-llvm-cov git jq qt6-base qt6-declarative
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ hashFiles('Cargo.lock') }}
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test with coverage
        run: |
          cargo llvm-cov --workspace --locked --no-report
          # The real-database tests need an installed system; the container has
          # one. They change it, so they run one after another.
          cargo llvm-cov --workspace --locked --no-report -- --ignored --test-threads=1
          cargo llvm-cov report --summary-only | tee coverage.txt
          cargo llvm-cov report --json --summary-only --output-path coverage.json
      - name: Coverage gate (core crates at least 90 %)
        run: scripts/coverage-gate.sh coverage.json 90 kura-core kura-i18n kura-sbom
      - name: Coverage summary
        if: always()
        run: |
          {
            echo '### Coverage'
            echo '```'
            cat coverage.txt 2>/dev/null || echo 'no report'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A throwaway Arch system: kura installs and removes packages for real here.
    container:
      image: archlinux:base-devel
      # Loop devices for the btrfs snapshot test.
      options: --privileged
    steps:
      - name: Install toolchain and services
        run: pacman -Syu --noconfirm --needed rust clang lld git dbus polkit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: e2e-${{ hashFiles('Cargo.lock') }}
      - name: Build
        run: cargo build --locked -p kura-cli -p kura-helper
      - name: Run end-to-end test
        run: scripts/e2e-container.sh target/debug

  e2e-aur:
    name: e2e-aur
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # AUR builds run in systemd's sandbox, so this Arch container boots systemd.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Boot an Arch system with systemd
        run: |
          docker run -d --name arch --privileged --cgroupns=host \
            -v /sys/fs/cgroup:/sys/fs/cgroup:rw -v "$PWD:/src" \
            --tmpfs /run --tmpfs /tmp \
            archlinux:base-devel /usr/lib/systemd/systemd
      - name: Build and install from the AUR
        run: docker exec arch /src/scripts/e2e-aur.sh
