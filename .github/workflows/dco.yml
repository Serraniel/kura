name: DCO

on:
  pull_request:

permissions:
  contents: read

jobs:
  sign-off:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check Signed-off-by on every commit
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            author=$(git show -s --format='%ae' "$c")
            if ! git show -s --format='%B' "$c" | grep -qi "^Signed-off-by: .*<$author>"; then
              echo "::error::Commit $c has no Signed-off-by line matching its author ($author)."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Sign off your commits with 'git commit -s'. See CONTRIBUTING.md."
            exit 1
          fi
