<!-- Installed to /usr/share/dbus-1/system.d/. Everyone may call kura-helper;
     kura-helper asks polkit before it changes anything. -->
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="org.kura.Helper1"/>
    <allow send_destination="org.kura.Helper1"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.kura.Helper1" send_interface="org.kura.Helper1"/>
    <allow send_destination="org.kura.Helper1" send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="org.kura.Helper1" send_interface="org.freedesktop.DBus.Peer"/>
  </policy>
</busconfig>
